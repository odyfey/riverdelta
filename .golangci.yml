version: "2"
run:
  concurrency: 4
linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dupl
    - gochecknoinits
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - errorlint
    - testifylint
    - wrapcheck
    - modernize
    - nilerr
    - noctx
  settings:
    goconst:
      min-len: 2
      min-occurrences: 2
    gocritic:
      disabled-checks:
        - wrapperFunc
        - hugeParam
        - rangeValCopy
        - singleCaseSwitch
        - ifElseChain
      enabled-tags:
        - performance
        - style
        - experimental
    govet:
      enable:
        - shadow
        - slog
    lll:
      line-length: 140
    misspell:
      locale: US
    wrapcheck:
      # our own packages already add context to their errors
      ignore-package-globs:
        - github.com/odyfey/riverdelta/*
  exclusions:
    generated: lax
    rules:
      - linters:
          - staticcheck
        text: at least one file in a package should have a package comment
      - linters:
          - revive
        text: should have comment or be unexported
      - linters:
          - revive
        text: "package-comments: should have a package comment"
      - linters:
          - dupl
          - gosec
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
